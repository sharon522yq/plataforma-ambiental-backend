# Despliegue en Render (sección 11 del prompt). Los valores secretos NO van aquí:
# las variables con `sync: false` se llenan a mano en el panel de Render (paso M8).
services:
  - type: web
    name: plataforma-ambiental-backend
    runtime: node
    plan: free
    # Misma región que la base de Supabase (East US), para menos latencia.
    region: virginia
    branch: main
    # --include=dev: TypeScript es dependencia de desarrollo y NODE_ENV=production la omitiría (D-37).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/salud
    autoDeploy: true
    envVars:
      # Configuración que no es secreta.
      - key: NODE_ENV
        value: production
      - key: PROXIES_DE_CONFIANZA
        value: "1"
      # Secretos y valores propios: se escriben en el panel de Render.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGENES
        sync: false
      # Correo (opcional, D-41). Sin estas dos, no se envían avisos.
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: SITIO_URL
        sync: false

  # Sitio público (F12): el mismo prototipo, servido como archivo estático. No tiene
  # secretos: la llave anon de Supabase llega desde GET /configuracion-publica (D-39).
  # El nombre define la URL (https://<nombre>.onrender.com); si está ocupado, Render le agrega un sufijo.
  - type: web
    name: plataforma-ambiental
    runtime: static
    branch: main
    buildCommand: echo "Sin compilación"
    staticPublishPath: ./prototipo
    autoDeploy: true
    buildFilter:
      paths:
        - prototipo/**
    headers:
      # Política de contenido: solo los orígenes que usa la página (scripts de cdnjs y jsdelivr,
      # fuentes de Google, teselas de OpenStreetMap, Nominatim, la API y Supabase).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.supabase.co; connect-src https://plataforma-ambiental-backend.onrender.com https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(self)"
