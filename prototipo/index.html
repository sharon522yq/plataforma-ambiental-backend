/* ---------- Utilidades ---------- */
function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of hijos.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function distancia(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* Markdown mínimo y seguro: negritas y listas, sin HTML (el backend devuelve Markdown). */
function markdownSeguro(texto) {
  const frag = document.createDocumentFragment();
  const enLinea = (linea) => linea.split(/(\*\*[^*]+\*\*)/g).filter(Boolean)
    .map((p) => p.startsWith("**") && p.endsWith("**") ? h("strong", null, p.slice(2, -2)) : document.createTextNode(p));
  let lista = null;
  for (const linea of texto.split("\n")) {
    const ul = linea.match(/^\s*[-*]\s+(.*)$/), ol = linea.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const tipo = ul ? "ul" : "ol";
      if (!lista || lista.tagName.toLowerCase() !== tipo) { lista = h(tipo); frag.append(lista); }
      lista.append(h("li", null, enLinea((ul || ol)[1])));
    } else if (linea.trim() === "") { lista = null; }
    else { lista = null; frag.append(h("p", null, enLinea(linea))); }
  }
  return frag;
}

/* ---------- API en vivo ---------- */
/* Llama a la API. Con sesión agrega el token de Supabase; `json` se envía como cuerpo JSON y `formulario` como multipart. */
async function api(ruta, { metodo = "GET", json, formulario } = {}) {
  const cabeceras = { Accept: "application/json" };
  if (estado.sb) {
    const { data } = await estado.sb.auth.getSession();
    if (data && data.session) cabeceras.Authorization = "Bearer " + data.session.access_token;
  }
  let cuerpoEnvio;
  if (json !== undefined) { cabeceras["Content-Type"] = "application/json"; cuerpoEnvio = JSON.stringify(json); }
  if (formulario) cuerpoEnvio = formulario;
  const r = await fetch(estado.api + ruta, { method: metodo, headers: cabeceras, body: cuerpoEnvio });
  let cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) {
    const detalles = cuerpo && cuerpo.error && Array.isArray(cuerpo.error.detalles) && cuerpo.error.detalles.length
      ? " (" + cuerpo.error.detalles.map((d) => d.mensaje || d.message || JSON.stringify(d)).join("; ") + ")" : "";
    const msg = cuerpo && cuerpo.error ? `${cuerpo.error.mensaje}${detalles}` : `HTTP ${r.status}`;
    const error = new Error(msg);
    error.estado = r.status;
    error.codigo = cuerpo && cuerpo.error ? cuerpo.error.codigo : null;
    throw error;
  }
  return cuerpo;
}
const SIN_CONEXION_PUBLICO = "No se pudo conectar con el servidor. Puede tardar hasta un minuto en despertar: espera un momento e intenta de nuevo.";
function mensajeError(e) {
  if (e.message !== "Failed to fetch") return e.message;
  return PUBLICO ? SIN_CONEXION_PUBLICO
    : "No se pudo conectar con la API. Sirve el prototipo en http://localhost:5173 (debe estar en CORS_ORIGENES) y espera a que Render despierte.";
}

/* ---------- Sesión real con Supabase Auth (solo en vivo) ---------- */
async function prepararAuth() {
  if (!enVivo() || estado.sb) return;
  if (!window.supabase) { estado.errorAuth = "No se pudo cargar la biblioteca de Supabase. Revisa la conexión a internet."; return; }
  try {
    const conf = await api("/configuracion-publica");
    estado.sb = window.supabase.createClient(conf.supabase_url, conf.supabase_anon_key);
    estado.errorAuth = null;
    estado.sb.auth.onAuthStateChange((evento) => {
      if (evento === "SIGNED_IN" || evento === "SIGNED_OUT" || evento === "USER_UPDATED") setTimeout(actualizarSesion, 0);
    });
    await actualizarSesion();
  } catch (e) {
    estado.errorAuth = "No se pudo leer la configuración de la API: " + mensajeError(e);
    pintarBanner();
  }
}
async function actualizarSesion() {
  if (!estado.sb) return;
  const { data } = await estado.sb.auth.getSession();
  const s = data && data.session;
  if (!s) { estado.sesion = null; }
  else {
    try {
      const yo = await api("/sesion");
      estado.sesion = { id: yo.id, rol: yo.rol, email: s.user.email };
      estado.errorAuth = null;
    } catch (e) {
      estado.sesion = null;
      estado.errorAuth = e.estado === 403
        ? "Tu cuenta existe pero no tiene un perfil activo. Pide a un administrador que la revise."
        : "No se pudo leer tu sesión: " + mensajeError(e);
    }
  }
  pintarCuenta();
  mostrar();
}

function vistaAsistente(raiz) {

                  f.enlace && /^https:\/\//.test(f.enlace) ? h("a", { href: f.enlace, target: "_blank", rel: "noopener noreferrer" }, f.titulo) : f.titulo,
                  " · ", f.fuente, f.fecha_fuente ? " · " + fecha(f.fecha_fuente + "T12:00:00") : "")))),
          m.error ? null : h("div", { class: "pie" },
            m.respaldo
              ? h("span", null, "Respuesta automática sin IA: el asistente no estaba disponible y se buscó directo en el mapa.")
              : h("span", null, "Modelo: ", h("span", { class: "mono" }, m.modelo), m.demo ? " · respuesta de ejemplo" : ""),
            m.respaldo ? null : h("span", null, m.aviso)))));
  };
  // «Usar mi ubicación»: se pide al navegador solo al marcar la casilla y se redondea a ~100 m.
  // El servidor la usa para buscar cerca; no se manda a Gemini ni se guarda.
  const usarUbicacion = h("input", { type: "checkbox", id: "a-ubicacion", checked: !!estado.miUbicacion });
  const estadoUbicacion = h("span", { class: "hint", id: "a-ubicacion-estado" }, estado.miUbicacion ? "Ubicación lista." : "");
  usarUbicacion.addEventListener("change", () => {
    if (!usarUbicacion.checked) { estado.miUbicacion = null; estadoUbicacion.textContent = ""; return; }
    if (!navigator.geolocation) { usarUbicacion.checked = false; estadoUbicacion.textContent = "Tu navegador no permite compartir la ubicación."; return; }
    estadoUbicacion.textContent = "Pidiendo tu ubicación…";
    navigator.geolocation.getCurrentPosition((pos) => {
      const r3 = (x) => Math.round(x * 1000) / 1000;
      estado.miUbicacion = { lat: r3(pos.coords.latitude), lng: r3(pos.coords.longitude) };
      estadoUbicacion.textContent = "Ubicación lista.";
    }, () => {
      usarUbicacion.checked = false; estado.miUbicacion = null;
      estadoUbicacion.textContent = "No se pudo obtener tu ubicación. Puedes nombrar tu ciudad en la pregunta.";
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  });
  const txt = h("textarea", { id: "a-pregunta", maxlength: "1000", placeholder: "Pregunta sobre un problema ambiental, cómo reportarlo o cómo ayudar" });
  const cuenta = h("span", { class: "hint mono" }, "0 / 1000");
  txt.addEventListener("input", () => { cuenta.textContent = `${txt.value.trim().length} / 1000`; });
  const enviar = h("button", { class: "btn primary", type: "submit" }, "Preguntar");
  const form = h("form", { class: "composer" }, h("div", { class: "row" }, txt, enviar),
    h("div", { class: "row" }, h("label", { class: "casilla", for: "a-ubicacion" }, usarUbicacion, " Usar mi ubicación para «cerca de mí»"), estadoUbicacion),
    h("div", { class: "row", style: "justify-content: space-between" },
      h("span", { class: "hint" }, "No escribas datos personales: el servidor quita correos y teléfonos antes de enviar la pregunta."), cuenta));
  const preguntar = async (pregunta) => {
    pregunta = pregunta.trim();
    if (pregunta.length < 3) { toast("Escribe al menos 3 caracteres."); return; }
    estado.chat.push({ de: "yo", texto: pregunta }); pintarMensajes();
    txt.value = ""; cuenta.textContent = "0 / 1000"; enviar.disabled = true;
    if (estado.fuente === "vivo") {
      try {
        const cuerpo = { pregunta };
        if (estado.miUbicacion) cuerpo.ubicacion = estado.miUbicacion;
        const r = await api("/agente/consulta", { metodo: "POST", json: cuerpo });
        estado.chat.push({ de: "ia", texto: r.respuesta, modelo: r.modelo, aviso: r.aviso, puntos: r.puntos || [], fuentes: r.fuentes || [], respaldo: !!r.respaldo });
      } catch (e) {

      }
    } else {
      const r = RESPUESTAS_DEMO.find((x) => x.pregunta === pregunta);
      await new Promise((ok) => setTimeout(ok, 500));
      const conPuntos = r && r.tipo ? respuestaDemoConPuntos(r.tipo) : null;
      estado.chat.push(conPuntos ? { de: "ia", texto: conPuntos.texto, puntos: conPuntos.puntos, modelo: MODELO, aviso: AVISO_IA, demo: true }
        : r ? { de: "ia", texto: r.respuesta, modelo: MODELO, aviso: AVISO_IA, demo: true }
        : { de: "ia", texto: "En el modo de ejemplo solo hay respuestas preparadas para las preguntas sugeridas. Cambia «Datos» a **API en vivo** para preguntarle a Gemini de verdad.", modelo: "—", aviso: "Mensaje del prototipo, no de la IA.", demo: true });
    }
    enviar.disabled = false; pintarMensajes();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  };
  form.addEventListener("submit", (e) => { e.preventDefault(); preguntar(txt.value); });
  txt.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); preguntar(txt.value); } });
  raiz.replaceChildren(h("div", { class: "chat" },
    h("div", { class: "view-head" }, h("div", null, h("h2", null, "Asistente ambiental"),
      h("p", null, "Responde dudas sobre problemas ambientales y cómo actuar.", PUBLICO ? " Funciona con inteligencia artificial (Gemini de Google)." : " Usa Gemini desde el backend; la llave nunca llega al navegador."))),
    h("div", { class: "sugerencias" }, RESPUESTAS_DEMO.map((r) => h("button", { type: "button", onclick: () => preguntar(r.pregunta) }, r.pregunta))),
    mensajes, form));
  pintarMensajes();

let puntosParaDuplicado = null;
async function vistaModeracionVivo(raiz) {

    h("div", { class: "subtabs", role: "group", "aria-label": "Estado" }, estados.map((s) => h("button", { type: "button", "aria-pressed": String(estado.modTab === s),
      onclick: () => { estado.modTab = s; vistaModeracionVivo(raiz); } }, s))),
    cola));

      api(`/admin/aportes?estado=${estado.modTab}&limite=50`),

    ]);

    if (!r.datos.length) { cola.replaceChildren(h("div", { class: "card" }, h("p", { class: "muted" }, `No hay aportes en estado ${estado.modTab}.`))); return; }
    cola.replaceChildren(...r.datos.map((a) => tarjetaModeracionVivo(a, puntos, raiz)));
  } catch (e) { cola.replaceChildren(h("p", { class: "err" }, mensajeError(e))); }

function tarjetaModeracionVivo(a, puntos, raiz) {
  const propio = a.autor_id === estado.sesion.id;
  const card = h("article", { class: "card" },
    h("div", { class: "row", style: "justify-content: space-between" },
      h("div", { class: "row" }, h("span", { class: "chip" }, TIPOS[a.tipo] || a.tipo), a.gravedad_sugerida ? sevBadge(a.gravedad_sugerida) : h("span", { class: "hint" }, "sin gravedad sugerida")),
      h("span", { class: "estado " + a.estado }, a.estado)),
    h("p", null, a.descripcion),
    h("dl", { class: "kv" },
      h("dt", null, "Autor"), h("dd", null, propio ? "Tú" : h("span", { class: "mono" }, "cuenta " + corto(a.autor_id))),
      h("dt", null, "Enviado"), h("dd", null, fechaHora(a.creado_en)),
      h("dt", null, "Ubicación"), h("dd", { class: "mono" }, coord(a.ubicacion)),
      h("dt", null, "Foto"), h("dd", null, enlaceFoto(a)),
      a.enlaces && a.enlaces.length ? [h("dt", null, "Enlaces"), h("dd", null, listaEnlacesAporte(a))] : null,

  if (propio) { card.append(h("p", { class: "hint" }, "Este aporte es tuyo: otra persona debe revisarlo.")); return card; }

  const titulo = h("input", { type: "text", class: "inp", id: "t-" + a.id, maxlength: "120", value: tituloSugerido(a) });
  let grav = a.gravedad_sugerida || 3;
  const segG = h("div", { class: "seg", role: "group", "aria-label": "Gravedad final" },
    [1, 2, 3, 4, 5].map((g) => h("button", { type: "button", "aria-pressed": String(grav === g), onclick: () => {
      grav = g; segG.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(grav === i + 1)));
    } }, String(g))));
  const motivo = h("input", { type: "text", class: "inp", id: "m-" + a.id, maxlength: "500", placeholder: "Obligatorio para rechazar" });
  const dup = h("select", { class: "inp", id: "d-" + a.id }, h("option", { value: "" }, "Elige el punto existente"),
    puntos.map((p) => h("option", { value: p.id }, p.titulo)));
  const err = h("div", { class: "err", role: "alert" });
  const botones = [];
  const decidir = async (decision) => {
    err.textContent = "";
    const m = motivo.value.trim();
    let cuerpo;
    if (decision === "aprobado") {
      if (titulo.value.trim().length < 3) { err.textContent = "El título necesita al menos 3 caracteres."; return; }
      cuerpo = { decision, titulo: titulo.value.trim(), gravedad: grav, publicar: true };
      if (m) cuerpo.motivo_revision = m;
    } else if (decision === "rechazado") {
      if (m.length < 3) { err.textContent = "Escribe el motivo del rechazo (mínimo 3 caracteres)."; motivo.focus(); return; }
      cuerpo = { decision, motivo_revision: m };
    } else {
      if (!dup.value) { err.textContent = "Elige de qué punto es duplicado."; return; }
      cuerpo = { decision, duplicado_de: dup.value };
      if (m) cuerpo.motivo_revision = m;
    }
    botones.forEach((b) => { b.disabled = true; });
    try {
      await api(`/admin/aportes/${a.id}/revision`, { metodo: "PATCH", json: cuerpo });
      if (decision === "aprobado") puntosParaDuplicado = null;
      toast(decision === "aprobado" ? "Aporte aprobado y publicado en el mapa." : decision === "rechazado" ? "Aporte rechazado. Quien lo envió verá el motivo." : "Aporte marcado como duplicado.");
      vistaModeracionVivo(raiz);
    } catch (e) {
      // 409: otra persona (u otro intento) ya lo revisó; se recarga la cola para no mostrar un aporte viejo.
      if (e.estado === 409) { toast("Este aporte ya estaba revisado. Se actualizó la cola."); vistaModeracionVivo(raiz); return; }
      err.textContent = "No se pudo guardar: " + mensajeError(e);
      botones.forEach((b) => { b.disabled = false; });
    }
  };
  botones.push(
    h("button", { class: "btn primary", type: "button", onclick: () => decidir("aprobado") }, "Aprobar y publicar"),
    h("button", { class: "btn danger", type: "button", onclick: () => decidir("rechazado") }, "Rechazar"),
    h("button", { class: "btn", type: "button", onclick: () => decidir("duplicado") }, "Marcar duplicado"));
  card.append(h("div", { class: "decision" },
    h("div", { class: "field" }, h("label", { class: "label", for: "t-" + a.id }, "Título público"), titulo),
    h("div", { class: "field" }, h("span", { class: "label" }, "Gravedad final"), segG),
    h("div", { class: "field" }, h("label", { class: "label", for: "m-" + a.id }, "Motivo de revisión"), motivo),
    h("div", { class: "field" }, h("label", { class: "label", for: "d-" + a.id }, "Duplicado de"), dup),
    err, h("div", { class: "row" }, botones)));
  return card;
}

/* Junta todas las páginas de un listado de la API (100 por página, tope de 20 páginas). */
async function todasLasPaginas(ruta) {
  const datos = [];
  let total = 0;
  for (let pagina = 1; pagina <= 20; pagina++) {
    const r = await api(`${ruta}${ruta.includes("?") ? "&" : "?"}limite=100&pagina=${pagina}`);
    datos.push(...r.datos);
    total = r.paginacion ? r.paginacion.total : datos.length;
    if (!r.paginacion || pagina >= r.paginacion.paginas) break;
  }
  return { datos, paginacion: { pagina: 1, limite: datos.length, total, paginas: 1 } };
}

/* ---------- Enrutador ---------- */
const VISTAS_VIVO = { "mis-aportes": vistaMisAportesVivo, moderacion: vistaModeracionVivo, administracion: vistaAdministracionVivo };
function mostrar() {
  const id = (location.hash || "#mapa").slice(1);
  estado.vista = id === "cuenta" || id === "privacidad" || VISTAS.some((v) => v.id === id) ? id : "mapa";
  // stop() corta un flyTo en curso antes de quitar el mapa (si no, Leaflet falla al terminar la animación).
  if (mapa) { mapa.stop(); mapa.remove(); mapa = null; }
  if (miniMapa) { miniMapa.stop(); miniMapa.remove(); miniMapa = null; miniMarcador = null; }
  const raiz = document.getElementById("main");
  pintarTabs(); pintarBanner();
  if (estado.vista === "cuenta") vistaCuenta(raiz);
  else if (estado.vista === "privacidad") vistaPrivacidad(raiz);
  else if (!puede(estado.vista)) vistaBloqueo(raiz, estado.vista);
  else if (enVivo() && VISTAS_VIVO[estado.vista]) VISTAS_VIVO[estado.vista](raiz);
  else ({ mapa: vistaMapa, reportar: vistaReportar, "mis-aportes": vistaMisAportes, moderacion: vistaModeracion, administracion: vistaAdministracion, asistente: vistaAsistente })[estado.vista](raiz);
  const hdr = document.getElementById("topbar").offsetHeight;
  document.documentElement.style.setProperty("--hdr", hdr + "px");
}

/* Alto contraste: se recuerda en este navegador; sin preferencia guardada, sigue la del sistema. */
function prepararContraste() {
  const boton = document.getElementById("contraste");
  const aplicar = (alto) => {
    if (alto) document.documentElement.dataset.contraste = "alto"; else delete document.documentElement.dataset.contraste;
    boton.setAttribute("aria-pressed", String(alto));
  };
  const guardado = leer("contraste");
  let sistema = false;
  try { sistema = window.matchMedia("(prefers-contrast: more)").matches; } catch (e) { /* navegador sin soporte */ }
  aplicar(guardado ? guardado === "alto" : sistema);
  boton.addEventListener("click", () => {
    const alto = boton.getAttribute("aria-pressed") !== "true";
    aplicar(alto); guardar("contraste", alto ? "alto" : "normal");
    if (mapa) pintarMarcadores();
  });
}
function iniciar() {
  const rolGuardado = leer("rol"), fuenteGuardada = leer("fuente");
  if (rolGuardado && ROLES[rolGuardado]) estado.rol = rolGuardado;
  if (!PUBLICO && (fuenteGuardada === "vivo" || fuenteGuardada === "demo")) estado.fuente = fuenteGuardada;
  document.documentElement.lang = "es";
  if (PUBLICO) {
    document.querySelector('label[for="fuente"]').hidden = true;
    document.querySelector(".brand .tag").textContent = "piloto";
  }
  pintarPie();
  prepararContraste();
  const selRol = document.getElementById("rol"), selFuente = document.getElementById("fuente");
  selRol.value = estado.rol; selFuente.value = estado.fuente;
  selRol.addEventListener("change", () => { estado.rol = selRol.value; guardar("rol", estado.rol); mostrar(); });
  selFuente.addEventListener("change", () => {
    estado.fuente = selFuente.value; estado.seleccionado = null; estado.cerca = null; estado.delAsistente = null; guardar("fuente", estado.fuente);
    revisarSalud(); pintarCuenta(); mostrar(); prepararAuth();
  });
  window.addEventListener("hashchange", mostrar);
  window.addEventListener("resize", () => { document.documentElement.style.setProperty("--hdr", document.getElementById("topbar").offsetHeight + "px"); });
  revisarSalud();
  pintarCuenta();
  mostrar();
  prepararAuth();
}
