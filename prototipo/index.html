/* Diseño: barra superior de app cívica; el mapa manda, el panel lateral lista y detalla. Severidad 1–5 en escala ámbar→rojo, acento verde azulado de institución ambiental. */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface-2: #f6f8f6;
  --ink: #15211d;
  --muted: #56665f;
  --line: #d3dbd6;
  --accent: #0d6a5a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --map-bg: #e3e9e4;
  --grid: #c3cec7;
  --sev-1: #c7a92b;
  --sev-2: #db8d2a;
  --sev-3: #d4692b;
  --sev-4: #c0432c;
  --sev-5: #8f2228;
  --ok: #2f7d4a;
  --warn: #a8660b;
  --bad: #b03a2e;
  --focus: #1b7fd1;
  --shadow: 0 1px 2px rgba(20, 35, 30, .08), 0 4px 14px rgba(20, 35, 30, .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --hdr: 112px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #151f1c; --surface-2: #1a2622; --ink: #e2eae6; --muted: #98aaa2; --line: #2a3a35;
    --accent: #3db39a; --accent-ink: #06201a; --accent-soft: #173a32; --map-bg: #17211e; --grid: #2c3b36;
    --sev-1: #d8bd45; --sev-2: #e9a043; --sev-3: #ec7f45; --sev-4: #e25a45; --sev-5: #c2424a;
    --ok: #5cbf7d; --warn: #e0a24a; --bad: #e46a5c; --focus: #63adf0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151f1c; --surface-2: #1a2622; --ink: #e2eae6; --muted: #98aaa2; --line: #2a3a35;
  --accent: #3db39a; --accent-ink: #06201a; --accent-soft: #173a32; --map-bg: #17211e; --grid: #2c3b36;
  --sev-1: #d8bd45; --sev-2: #e9a043; --sev-3: #ec7f45; --sev-4: #e25a45; --sev-5: #c2424a;
  --ok: #5cbf7d; --warn: #e0a24a; --bad: #e46a5c; --focus: #63adf0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--surface); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .86em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 900; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-row { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand h1 { font-size: 1.2rem; letter-spacing: -.01em; }
.brand .tag { font: 500 .68rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of hijos.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const fecha = (iso) => new Date(iso).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });

function sevBadge(g) {

  return h("span", { class: "sev" }, h("i", { style: `background: var(--sev-${g})` }), `${g} · ${GRAVEDAD[g]}`);

function distancia(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* Markdown mínimo y seguro: negritas y listas, sin HTML (el backend devuelve Markdown). */
function markdownSeguro(texto) {
  const frag = document.createDocumentFragment();
  const enLinea = (linea) => linea.split(/(\*\*[^*]+\*\*)/g).filter(Boolean)
    .map((p) => p.startsWith("**") && p.endsWith("**") ? h("strong", null, p.slice(2, -2)) : document.createTextNode(p));
  let lista = null;
  for (const linea of texto.split("\n")) {
    const ul = linea.match(/^\s*[-*]\s+(.*)$/), ol = linea.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const tipo = ul ? "ul" : "ol";
      if (!lista || lista.tagName.toLowerCase() !== tipo) { lista = h(tipo); frag.append(lista); }
      lista.append(h("li", null, enLinea((ul || ol)[1])));
    } else if (linea.trim() === "") { lista = null; }
    else { lista = null; frag.append(h("p", null, enLinea(linea))); }
  }
  return frag;
}

/* Llama a la API. Con sesión agrega el token de Supabase; `json` se envía como cuerpo JSON y `formulario` como multipart. */
async function api(ruta, { metodo = "GET", json, formulario } = {}) {
  const cabeceras = { Accept: "application/json" };
  if (estado.sb) {
    const { data } = await estado.sb.auth.getSession();
    if (data && data.session) cabeceras.Authorization = "Bearer " + data.session.access_token;
  }
  let cuerpoEnvio;
  if (json !== undefined) { cabeceras["Content-Type"] = "application/json"; cuerpoEnvio = JSON.stringify(json); }
  if (formulario) cuerpoEnvio = formulario;
  const r = await fetch(estado.api + ruta, { method: metodo, headers: cabeceras, body: cuerpoEnvio });
  let cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) {
    const detalles = cuerpo && cuerpo.error && Array.isArray(cuerpo.error.detalles) && cuerpo.error.detalles.length
      ? " (" + cuerpo.error.detalles.map((d) => d.mensaje || d.message || JSON.stringify(d)).join("; ") + ")" : "";
    const msg = cuerpo && cuerpo.error ? `${cuerpo.error.mensaje}${detalles}` : `HTTP ${r.status}`;
    const error = new Error(msg);
    error.estado = r.status;
    error.codigo = cuerpo && cuerpo.error ? cuerpo.error.codigo : null;
    throw error;
  }
  return cuerpo;
}
function mensajeError(e) {
  return e.message === "Failed to fetch"
    ? "No se pudo conectar con la API. Sirve el prototipo en http://localhost:5173 (debe estar en CORS_ORIGENES) y espera a que Render despierte."
    : e.message;
}

let mapa = null, capaPuntos = null, capaCerca = null, marcadores = new Map();
function crearMapa(contenedor, opciones) {
  if (!window.L) { contenedor.replaceChildren(h("div", { class: "vacio" }, "No se pudo cargar la biblioteca del mapa (Leaflet). Revisa la conexión a internet.")); return null; }
  const m = L.map(contenedor, Object.assign({ zoomControl: true, attributionControl: true }, opciones)).setView(CENTRO, 12);
  let fallo = false;
  const teselas = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; colaboradores de OpenStreetMap",
  });
  teselas.on("tileerror", () => {
    if (fallo) return; fallo = true;
    m.removeLayer(teselas);
    cuadricula(m);
    const aviso = h("div", { class: "aviso-mapa" }, "Sin mapa base: esta vista no permite cargar OpenStreetMap. Se muestra una cuadrícula de coordenadas reales. Abre el prototipo desde tu PC para ver las calles.");
    contenedor.append(aviso);
  });
  teselas.addTo(m);
  return m;
}
function cuadricula(m) {
  const color = getComputedStyle(document.documentElement).getPropertyValue("--grid").trim();
  const g = L.layerGroup().addTo(m);
  for (let lat = 20.5; lat <= 20.86; lat += 0.02) L.polyline([[lat, -103.56], [lat, -103.16]], { color, weight: 1, interactive: false }).addTo(g);
  for (let lng = -103.56; lng <= -103.16; lng += 0.02) L.polyline([[20.5, lng], [20.86, lng]], { color, weight: 1, interactive: false }).addTo(g);
  for (let lat = 20.6; lat <= 20.76; lat += 0.04) {
    L.marker([lat, -103.46], { interactive: false, icon: L.divIcon({ className: "", html: `<span class="mono small muted">${lat.toFixed(2)}°N</span>`, iconSize: [60, 14] }) }).addTo(g);
  }
  for (let lng = -103.44; lng <= -103.26; lng += 0.04) {
    L.marker([20.585, lng], { interactive: false, icon: L.divIcon({ className: "", html: `<span class="mono small muted">${Math.abs(lng).toFixed(2)}°O</span>`, iconSize: [64, 14] }) }).addTo(g);
  }
}

  const cont = h("div", null, h("p", { class: "muted" }, "Cargando…"));
  raiz.replaceChildren(h("div", { class: "wrap" },
    cabecera("Administración", esAdmin ? "Catálogo, roles y auditoría con datos reales de la base." : "Con el rol de editor administras el catálogo de acciones y organizaciones."),
    h("div", { class: "subtabs", role: "group", "aria-label": "Apartado" }, tabs.map(([id, nombre, ok]) => h("button", { type: "button", "aria-pressed": String(estado.adminTab === id), disabled: !ok,
      title: ok ? null : "Solo administración", onclick: () => { estado.adminTab = id; vistaAdministracionVivo(raiz); } }, ok ? nombre : [candado(), " ", nombre]))),
    cont));
  const recargar = () => vistaAdministracionVivo(raiz);
  try {
    if (estado.adminTab === "catalogo") cont.replaceChildren(await panelCatalogoVivo(recargar));
    if (estado.adminTab === "usuarios") cont.replaceChildren(await panelUsuariosVivo());
    if (estado.adminTab === "auditoria") cont.replaceChildren(await panelAuditoriaVivo());
  } catch (e) { cont.replaceChildren(h("p", { class: "err" }, mensajeError(e))); }
}
async function panelCatalogoVivo(recargar) {

  const nombre = h("input", { type: "text", id: "c-nombre", maxlength: "120" });
  const descripcion = h("input", { type: "text", id: "c-desc", maxlength: "1000" });
  const enlace = h("input", { type: "url", id: "c-enlace", placeholder: "https://" });
  const org = h("select", { id: "c-org" }, h("option", { value: "" }, "Sin organización"), orgs.map((o) => h("option", { value: o.id }, o.nombre)));
  const punto = h("select", { id: "c-punto" }, h("option", { value: "" }, "Acción general (sin punto)"), puntos.map((p) => h("option", { value: p.id }, p.titulo)));
  const errA = h("div", { class: "err", role: "alert" });
  fA.append(h("h3", null, "Nueva acción"),
    h("div", { class: "field" }, h("label", { class: "label", for: "c-tipo" }, "Tipo"), tipo),
    h("div", { class: "field" }, h("label", { class: "label", for: "c-nombre" }, "Nombre"), nombre),
    h("div", { class: "field" }, h("label", { class: "label", for: "c-desc" }, "Descripción (opcional)"), descripcion),
    h("div", { class: "field" }, h("label", { class: "label", for: "c-enlace" }, "Enlace (opcional)"), enlace, h("span", { class: "hint" }, "Solo enlaces https.")),
    h("div", { class: "field" }, h("label", { class: "label", for: "c-org" }, "Organización"), org),
    h("div", { class: "field" }, h("label", { class: "label", for: "c-punto" }, "Punto"), punto),
    errA, h("div", null, h("button", { class: "btn primary", type: "submit" }, "Crear acción")));
  fA.addEventListener("submit", async (e) => {
    e.preventDefault(); errA.textContent = "";
    if (nombre.value.trim().length < 3) { errA.textContent = "El nombre necesita al menos 3 caracteres."; return; }
    if (enlace.value.trim() && !/^https:\/\/\S+$/.test(enlace.value.trim())) { errA.textContent = "El enlace debe empezar con https://"; return; }
    const cuerpo = { tipo: tipo.value, nombre: nombre.value.trim() };
    if (descripcion.value.trim()) cuerpo.descripcion = descripcion.value.trim();
    if (enlace.value.trim()) cuerpo.enlace = enlace.value.trim();
    if (org.value) cuerpo.organizacion_id = org.value;
    if (punto.value) cuerpo.punto_id = punto.value;
    try { await api("/admin/acciones", { metodo: "POST", json: cuerpo }); toast("Acción creada. Ya aparece en «Cómo ayudar»."); recargar(); }
    catch (err) { errA.textContent = "No se pudo crear: " + mensajeError(err); }
  });

  const fO = h("form", { class: "card", novalidate: true });
  const oNombre = h("input", { type: "text", id: "o-nombre", maxlength: "120" });
  const oZona = h("input", { type: "text", id: "o-zona", maxlength: "80" });
  const oContacto = h("input", { type: "text", id: "o-contacto", maxlength: "200" });
  const errO = h("div", { class: "err", role: "alert" });
  fO.append(h("h3", null, "Nueva organización"),
    h("div", { class: "field" }, h("label", { class: "label", for: "o-nombre" }, "Nombre"), oNombre),
    h("div", { class: "field" }, h("label", { class: "label", for: "o-zona" }, "Zona (opcional)"), oZona),
    h("div", { class: "field" }, h("label", { class: "label", for: "o-contacto" }, "Contacto interno (opcional)"), oContacto, h("span", { class: "hint" }, "Lo ve el personal; la API pública nunca lo muestra.")),
    errO, h("div", null, h("button", { class: "btn primary", type: "submit" }, "Crear organización")),
    h("div", { class: "tabla-wrap" }, h("table", null, h("thead", null, h("tr", null, h("th", null, "Organización"), h("th", null, "Zona"))),
      h("tbody", null, orgs.map((o) => h("tr", null, h("td", null, o.nombre), h("td", null, o.zona || "—")))))));
  fO.addEventListener("submit", async (e) => {
    e.preventDefault(); errO.textContent = "";
    if (oNombre.value.trim().length < 3) { errO.textContent = "El nombre necesita al menos 3 caracteres."; return; }
    const cuerpo = { nombre: oNombre.value.trim() };
    if (oZona.value.trim()) cuerpo.zona = oZona.value.trim();

}
async function panelUsuariosVivo() {
  const r = await api("/admin/usuarios?limite=100");
  return h("div", { class: "tabla-wrap" }, h("table", null,
    h("thead", null, h("tr", null, ["Usuario", "Correo", "Rol", "Estado"].map((t) => h("th", null, t)))),
    h("tbody", null, r.datos.map((u) => {
      const propio = u.id === estado.sesion.id;
      const sel = h("select", { class: "inp", "aria-label": "Rol de " + u.nombre, disabled: propio, style: "max-width: 200px" },
        ["ciudadano", "moderador", "editor", "administrador"].map((rol) => h("option", { value: rol, selected: u.rol === rol }, ROLES[rol])));
      sel.addEventListener("change", async () => {
        const anterior = u.rol;
        try { const c = await api(`/admin/usuarios/${u.id}/rol`, { metodo: "PATCH", json: { rol: sel.value } }); u.rol = c.rol; toast(`Rol de ${u.nombre} cambiado a ${ROLES[c.rol].toLowerCase()}.`); }
        catch (e) { sel.value = anterior; toast("No se pudo cambiar el rol: " + mensajeError(e)); }
      });
      return h("tr", null,
        h("td", null, u.nombre, propio ? h("div", { class: "hint" }, "No puedes cambiar tu propio rol.") : null),
        h("td", { class: "small" }, u.email || "—"), h("td", null, sel),
        h("td", null, h("span", { class: "estado " + (u.activo ? "aprobado" : "rechazado") }, u.activo ? "activo" : "inactivo")));
    }))));
}
async function panelAuditoriaVivo() {

      h("td", { class: "mono" }, x.usuario_id ? (x.usuario_id === estado.sesion.id ? "tú" : corto(x.usuario_id)) : "sistema"), h("td", { class: "mono" }, corto(x.registro_id)))))));
}

/* ---------- Enrutador ---------- */
const VISTAS_VIVO = { "mis-aportes": vistaMisAportesVivo, moderacion: vistaModeracionVivo, administracion: vistaAdministracionVivo };
function mostrar() {
  const id = (location.hash || "#mapa").slice(1);
  estado.vista = id === "cuenta" || VISTAS.some((v) => v.id === id) ? id : "mapa";
  if (mapa) { mapa.remove(); mapa = null; }
  if (miniMapa) { miniMapa.remove(); miniMapa = null; miniMarcador = null; }
  const raiz = document.getElementById("main");
  pintarTabs(); pintarBanner();
  if (estado.vista === "cuenta") vistaCuenta(raiz);
  else if (!puede(estado.vista)) vistaBloqueo(raiz, estado.vista);
  else if (enVivo() && VISTAS_VIVO[estado.vista]) VISTAS_VIVO[estado.vista](raiz);
  else ({ mapa: vistaMapa, reportar: vistaReportar, "mis-aportes": vistaMisAportes, moderacion: vistaModeracion, administracion: vistaAdministracion, asistente: vistaAsistente })[estado.vista](raiz);
  const hdr = document.getElementById("topbar").offsetHeight;
  document.documentElement.style.setProperty("--hdr", hdr + "px");
}

function iniciar() {
  const rolGuardado = leer("rol"), fuenteGuardada = leer("fuente");
  if (rolGuardado && ROLES[rolGuardado]) estado.rol = rolGuardado;
  if (fuenteGuardada === "vivo" || fuenteGuardada === "demo") estado.fuente = fuenteGuardada;
  const selRol = document.getElementById("rol"), selFuente = document.getElementById("fuente");
  selRol.value = estado.rol; selFuente.value = estado.fuente;
  selRol.addEventListener("change", () => { estado.rol = selRol.value; guardar("rol", estado.rol); mostrar(); });
  selFuente.addEventListener("change", () => {
    estado.fuente = selFuente.value; estado.seleccionado = null; estado.cerca = null; guardar("fuente", estado.fuente);
    revisarSalud(); pintarCuenta(); mostrar(); prepararAuth();
  });
  window.addEventListener("hashchange", mostrar);
  window.addEventListener("resize", () => { document.documentElement.style.setProperty("--hdr", document.getElementById("topbar").offsetHeight + "px"); });
  revisarSalud();
  pintarCuenta();
  mostrar();
  prepararAuth();
}
iniciar();
</script>
